apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    sidecar.istio.io/inject: 'false'
  labels:
    app: strimzi
  name: strimzi-cluster-operator
  namespace: ns-data-hc
spec:
  replicas: 1
  selector:
    matchLabels:
      name: strimzi-cluster-operator
      strimzi.io/kind: cluster-operator
  template:
    metadata:
      labels:
        name: strimzi-cluster-operator
        strimzi.io/kind: cluster-operator
    spec:
      containers:
        - args:
            - /opt/strimzi/bin/cluster_operator_run.sh
          env:
            - name: STRIMZI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STRIMZI_FULL_RECONCILIATION_INTERVAL_MS
              value: '120000'
            - name: STRIMZI_NETWORK_POLICY_GENERATION
              value: 'false'
            - name: STRIMZI_OPERATION_TIMEOUT_MS
              value: '300000'
            - name: STRIMZI_DEFAULT_TLS_SIDECAR_ENTITY_OPERATOR_IMAGE
              value: 'quay.io/strimzi/kafka:0.39.0-kafka-3.6.1'
            - name: STRIMZI_DEFAULT_KAFKA_EXPORTER_IMAGE
              value: 'quay.io/strimzi/kafka:0.39.0-kafka-3.6.1'
            - name: STRIMZI_DEFAULT_CRUISE_CONTROL_IMAGE
              value: 'quay.io/strimzi/kafka:0.39.0-kafka-3.6.1'
            - name: STRIMZI_KAFKA_IMAGES
              value: |
                3.5.0=quay.io/strimzi/kafka:0.39.0-kafka-3.5.0
                3.5.1=quay.io/strimzi/kafka:0.39.0-kafka-3.5.1
                3.5.2=quay.io/strimzi/kafka:0.39.0-kafka-3.5.2
                3.6.0=quay.io/strimzi/kafka:0.39.0-kafka-3.6.0
                3.6.1=quay.io/strimzi/kafka:0.39.0-kafka-3.6.1
            - name: STRIMZI_KAFKA_CONNECT_IMAGES
              value: |
                3.5.0=quay.io/strimzi/kafka:0.39.0-kafka-3.5.0
                3.5.1=quay.io/strimzi/kafka:0.39.0-kafka-3.5.1
                3.5.2=quay.io/strimzi/kafka:0.39.0-kafka-3.5.2
                3.6.0=quay.io/strimzi/kafka:0.39.0-kafka-3.6.0
                3.6.1=quay.io/strimzi/kafka:0.39.0-kafka-3.6.1
            - name: STRIMZI_KAFKA_MIRROR_MAKER_IMAGES
              value: |
                3.5.0=quay.io/strimzi/kafka:0.39.0-kafka-3.5.0
                3.5.1=quay.io/strimzi/kafka:0.39.0-kafka-3.5.1
                3.5.2=quay.io/strimzi/kafka:0.39.0-kafka-3.5.2
                3.6.0=quay.io/strimzi/kafka:0.39.0-kafka-3.6.0
                3.6.1=quay.io/strimzi/kafka:0.39.0-kafka-3.6.1
            - name: STRIMZI_KAFKA_MIRROR_MAKER_2_IMAGES
              value: |
                3.5.0=quay.io/strimzi/kafka:0.39.0-kafka-3.5.0
                3.5.1=quay.io/strimzi/kafka:0.39.0-kafka-3.5.1
                3.5.2=quay.io/strimzi/kafka:0.39.0-kafka-3.5.2
                3.6.0=quay.io/strimzi/kafka:0.39.0-kafka-3.6.0
                3.6.1=quay.io/strimzi/kafka:0.39.0-kafka-3.6.1
            - name: STRIMZI_DEFAULT_TOPIC_OPERATOR_IMAGE
              value: 'quay.io/strimzi/operator:0.39.0'
            - name: STRIMZI_DEFAULT_USER_OPERATOR_IMAGE
              value: 'quay.io/strimzi/operator:0.39.0'
            - name: STRIMZI_DEFAULT_KAFKA_INIT_IMAGE
              value: 'quay.io/strimzi/operator:0.39.0'
            - name: STRIMZI_DEFAULT_KAFKA_BRIDGE_IMAGE
              value: 'quay.io/strimzi/kafka-bridge:0.27.0'
            - name: STRIMZI_DEFAULT_KANIKO_EXECUTOR_IMAGE
              value: 'quay.io/strimzi/kaniko-executor:0.39.0'
            - name: STRIMZI_DEFAULT_MAVEN_BUILDER
              value: 'quay.io/strimzi/maven-builder:0.39.0'
            - name: STRIMZI_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STRIMZI_FEATURE_GATES
              value: ''
            - name: STRIMZI_LEADER_ELECTION_ENABLED
              value: 'true'
            - name: STRIMZI_LEADER_ELECTION_LEASE_NAME
              value: strimzi-cluster-operator
            - name: STRIMZI_LEADER_ELECTION_LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STRIMZI_LEADER_ELECTION_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          image: 'quay.io/strimzi/operator:0.39.0'
          livenessProbe:
            httpGet:
              path: /healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          name: strimzi-cluster-operator
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: 1000m
              memory: 384Mi
            requests:
              cpu: 200m
              memory: 384Mi
          volumeMounts:
            - mountPath: /tmp
              name: strimzi-tmp
            - mountPath: /opt/strimzi/custom-config/
              name: co-config-volume
      serviceAccountName: strimzi-cluster-operator
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: strimzi-tmp
        - configMap:
            name: strimzi-cluster-operator
          name: co-config-volume
