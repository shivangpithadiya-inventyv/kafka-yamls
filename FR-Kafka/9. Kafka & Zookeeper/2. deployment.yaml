apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: fr-data
  namespace: ns-data-hc
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    config:
      log.message.format.version: '3.6'
      offsets.topic.replication.factor: 5
      ssl.cipher.suites: >-
        TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_AES_256_GCM_SHA384
      ssl.enabled.protocols: 'TLSv1.3, TLSv1.2'
      ssl.protocol: TLSv1.3
      transaction.state.log.min.isr: 4
      transaction.state.log.replication.factor: 5
    listeners:
      - authentication:
          type: scram-sha-512
        name: tlsinternal
        port: 9095
        tls: true
        type: internal
      - authentication:
          type: scram-sha-512
        configuration:
          bootstrap:
            nodePort: 30960
          brokers:
            - advertisedHost: 192.168.42.14
              broker: 0
              nodePort: 30961
            - advertisedHost: 192.168.42.15
              broker: 1
              nodePort: 30962
            - advertisedHost: 192.168.42.16
              broker: 2
              nodePort: 30963
            - advertisedHost: 192.168.42.17
              broker: 3
              nodePort: 30964
            - advertisedHost: 192.168.42.18
              broker: 4
              nodePort: 30965
            - advertisedHost: 192.168.42.19
              broker: 5
              nodePort: 30966
            - advertisedHost: 192.168.42.20
              broker: 6
              nodePort: 30967
        name: tlsexternal
        port: 9096
        tls: true
        type: nodeport
      - name: plain
        port: 9092
        tls: false
        type: internal
      - configuration:
          bootstrap:
            nodePort: 30940
          brokers:
            - advertisedHost: 192.168.42.14
              broker: 0
              nodePort: 30921
            - advertisedHost: 192.168.42.15
              broker: 1
              nodePort: 30922
            - advertisedHost: 192.168.42.16
              broker: 2
              nodePort: 30923
            - advertisedHost: 192.168.42.17
              broker: 3
              nodePort: 30924
            - advertisedHost: 192.168.42.18
              broker: 4
              nodePort: 30925
            - advertisedHost: 192.168.42.19
              broker: 5
              nodePort: 30926
            - advertisedHost: 192.168.42.20
              broker: 6
              nodePort: 30927
        name: external
        port: 9094
        tls: false
        type: nodeport
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          key: kafka-metrics-config.yml
          name: kafka-metrics
    replicas: 7
    storage:
      type: jbod
      volumes:
        - class: sc-kafka
          deleteClaim: false
          id: 0
          size: 200Gi
          type: persistent-claim
    template:
      pod:
        metadata:
          annotations:
            sidecar.istio.io/inject: 'false'
    version: 3.6.1
  kafkaExporter:
    groupRegex: .*
    template:
      pod:
        metadata:
          annotations:
            sidecar.istio.io/inject: 'false'
    topicRegex: .*
  zookeeper:
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          key: zookeeper-metrics-config.yml
          name: kafka-metrics
    replicas: 7
    storage:
      class: sc-zookeeper
      deleteClaim: false
      size: 200Gi
      type: persistent-claim
    template:
      pod:
        metadata:
          annotations:
            sidecar.istio.io/inject: 'false'
