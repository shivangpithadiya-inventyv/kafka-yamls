apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/bound-by-controller: 'yes'
  finalizers:
    - kubernetes.io/pv-protection
  name: pv-zookeeper-01
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 20Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: data-ab-data-zookeeper-0
    namespace: ns-data
  hostPath:
    path: /var/data/zookeeper
    type: ''
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-172-31-87-148
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sc-zookeeper
  volumeMode: Filesystem
